<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Killed Sabrina - Reader</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .header p {
            color: #b0b0b0;
            font-size: 0.95rem;
            font-style: italic;
        }

        /* COVER DISPLAY */
        .cover-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .book-cover {
            max-width: 300px;
            height: auto;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            border: 2px solid #d4af37;
        }

        /* CHAPTERS GRID */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chapter-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .chapter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
            border-color: #ff4444;
        }

        .chapter-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chapter-number {
            color: #ff4444;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chapter-title {
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .chapter-preview {
            color: #a0a0a0;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .lock-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
        }

        .unlock-button {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .unlock-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 68, 68, 0.4);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #d4af37;
            border-radius: 8px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            width: 100%;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #ff4444;
            background: none;
            border: none;
        }

        .modal-close:hover {
            transform: scale(1.2);
        }

        .modal-title {
            color: #ff4444;
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .chapter-text {
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 1rem;
            margin: 20px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* GAMES */
        .game-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
        }

        .game-title {
            color: #d4af37;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* MEMORY GAME */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .memory-card {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border: 2px solid #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: all 0.3s;
            font-size: 1.5rem;
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        .memory-card.flipped {
            background: #d4af37;
            color: #1a1a1a;
        }

        /* TRIVIA GAME */
        .trivia-question {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .trivia-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trivia-option {
            background: #2a2a2a;
            border: 2px solid #d4af37;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .trivia-option:hover {
            background: #d4af37;
            color: #1a1a1a;
        }

        .trivia-option.correct {
            background: #00cc00;
            border-color: #00ff00;
        }

        .trivia-option.incorrect {
            background: #ff4444;
            border-color: #ff0000;
        }

        /* AD SPACE */
        .ad-space {
            background: #2a2a2a;
            border: 2px dashed #d4af37;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #a0a0a0;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 68, 68, 0.4);
        }

        .success-message {
            color: #00ff00;
            font-weight: bold;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .chapters-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }

            .memory-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .memory-card {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const chapters = [
            {
                id: 1,
                number: "1",
                title: "The Red Prom",
                preview: "Khalid discovers his best friend Sabrina dead at prom...",
                content: `KHALID POV

My best friend bled to death just fifty feet away from me, and I was completely oblivious. I don't think I will ever forgive myself for that.

The warm Santa Ana wind is whipping through the Peace Bridge Academy parking lot, rustling the dry, dying fronds of the palm trees lining the football field. I'm entirely distracted. I've got Ashlyn pressed against the side of my dented Honda Civic, her arms looped loosely around my neck, and we are both happily ignoring the heavy, muffled bass vibrating through the gymnasium walls.

Then my phone buzzes against my thigh. Twice in rapid succession.

I pull back, ignoring Ashlyn's heavy, annoyed sigh. I already know who it is. I don't even need to look at the screen. Sabrina is the only person on this entire campus who would actively interrupt me tonight.

Sabrina: Where are you hiding? I'm having wine. Come out from wherever you are.

I huff a laugh, the screen lighting up my face in the dark. We clicked the very first week of freshman year when we slammed into each other in the cafeteria, wearing each other's spaghetti marinara like a badge of honor. She doesn't do subtle things. But lately, things have been weird. Secretive.

Me: You know you aren't supposed to be having any of that right now.

I watch the three typing dots bubble up on the screen.

Sabrina: Chill out. Sebastian specifically gave it to me, so I'm safe.

I roll my eyes so hard they ache. I cannot stand Sebastian. He is the ultimate Peace Bridge golden boy, a walking, talking Ivy League brochure with a perfectly symmetrical face and a fake-humble smile. Everyone buys his routine, but I see right through it.`
            },
            {
                id: 2,
                number: "2",
                title: "The Ghost in the Corridor",
                preview: "Priscilla arrives at the hospital and discovers her best friend is truly gone...",
                content: `PRISCILLA POV

The automatic doors of South Coast Medical Center slide open, and the suffocating smell of industrial bleach and medicine hits the back of my throat. I don't remember the drive. I don't even remember parking my car or running across the wet asphalt of the emergency lot. My mind has completely detached from my body, floating somewhere above the blinding fluorescent lights of the hospital corridor.

My chest is incredibly tight. The air in here feels too thick to breathe, heavy with the weight of other people's tragedies. I push past a cluster of weeping family members and a nurse holding a clipboard, my eyes scanning the sterile waiting area.

Then I see him. Khalid is slumped in a plastic chair near the trauma double doors. His posture is entirely wrong. The funny, confident boy who always has a sharp comeback is folded into half, staring blankly at the floor. His tuxedo is ruined. His hands…oh God, his hands, are stained with dark, flaking rust. Blood.

The remaining air in my lungs vanishes. My legs turn to lead, but I force myself to keep walking. Khalid doesn't even look up as I pass him. He is a ghost.

I slam my hands against the swinging doors of the trauma bay and push through.

The room is freezing. It feels like walking into a vault. A doctor and two nurses are standing near the corner, speaking in low, hushed tones, but they blur into the background. The only thing in focus is the metal table in the center of the room.

They haven't covered her face yet. My breath hitches, a jagged, ugly sound tearing out of my throat.`
            },
            {
                id: 3,
                number: "3",
                title: "Shadows in the Sun",
                preview: "Sabrina meets Khalid in the cafeteria and finds connection before everything changes...",
                content: `SABRINA POV

The cafeteria at Peace Bridge Academy is basically a war zone with better lighting and overpriced organic tater tots. It's loud, chaotic, and it smells like a bizarre mix of expensive teenage perfume, and whatever heavily-sauced mystery meat the culinary staff is trying to pass off as artisanal today.

I'm balancing a plastic tray loaded with a dangerously full plate of spaghetti marinara in one hand and my phone in the other. Priscilla is safely tucked away in her private, soundproofed study room on the other side of campus. The sheer volume of this room would trigger a massive panic attack for her, so I'm flying solo for the next twenty minutes.

My thumbs are flying across the screen. I swear to God, if Jarvis flips her hair over her shoulder one more time, I'm going to accidentally trip her.

I don't even have time to hit send. I slam into something solid and hard.

My phone goes flying. The plastic tray flips out of my hand like it's in slow motion. A tidal wave of hot red marinara sauce, noodles, and a rogue garlic knot launches through the air and completely coats the chest of the guy I just walked into.

The cafeteria around us instantly goes dead silent. The kind of silence where you can hear a pin drop, or in this case, a single meatball rolling pathetically across the linoleum floor.

I freeze, my eyes trailing up from the ruined, perfectly crisp white button-down shirt to the face of the victim.

It's a guy from my AP European History class. Khalid. He's half-British, half-Indian, and usually sits in the back row looking like he's internally roasting everyone in the room. Right now, he has a wet noodle dangling off the collar of his shirt.

He looks down at his chest. He looks at the floor. Then he looks slowly up at me.

"Well," Khalid says, his voice deadpan and laced with a dry, sharp accent that cuts right through the cafeteria silence. "I was actually thinking this shirt was a bit too white. Guess, I needed a pop of color. Really appreciate the stylistic input."`
            }
        ];

        const games = {
            memory: [
                { id: 1, emoji: '🔴', name: 'Red' },
                { id: 2, emoji: '🖤', name: 'Black' },
                { id: 3, emoji: '💀', name: 'Skull' },
                { id: 4, emoji: '📖', name: 'Book' },
                { id: 1, emoji: '🔴', name: 'Red' },
                { id: 2, emoji: '🖤', name: 'Black' },
                { id: 3, emoji: '💀', name: 'Skull' },
                { id: 4, emoji: '📖', name: 'Book' }
            ],
            trivia: [
                {
                    question: "What is Sabrina's best friend's name?",
                    options: ['Priscilla', 'Jarvis', 'Ashlyn', 'Evelyn'],
                    correct: 'Priscilla'
                }
            ]
        };

        function App() {
            const [currentChapter, setCurrentChapter] = useState(null);
            const [unlockedChapters, setUnlockedChapters] = useState([1]);
            const [gameType, setGameType] = useState(null);
            const [memoryFlipped, setMemoryFlipped] = useState({});
            const [memoryMatched, setMemoryMatched] = useState({});
            const [triviaAnswered, setTriviaAnswered] = useState(false);
            const [triviaCorrect, setTriviaCorrect] = useState(false);
            const [targetChapterUnlock, setTargetChapterUnlock] = useState(null);

            const closeModal = () => {
                setCurrentChapter(null);
                setGameType(null);
                setTriviaAnswered(false);
                setTriviaCorrect(false);
            };

            const readChapter = (chapter) => {
                if (unlockedChapters.includes(chapter.id)) {
                    setCurrentChapter(chapter);
                }
            };

            const openGameForUnlock = (chapterId) => {
                setTargetChapterUnlock(chapterId);
                setGameType('unlock');
            };

            const unlockChapterThroughGame = (gameChoice) => {
                if (targetChapterUnlock && !unlockedChapters.includes(targetChapterUnlock)) {
                    setGameType(gameChoice);
                }
            };

            const handleMemoryCardClick = (index) => {
                if (memoryFlipped[index] || memoryMatched[index]) return;

                const newFlipped = { ...memoryFlipped, [index]: true };
                setMemoryFlipped(newFlipped);

                const flippedIndices = Object.keys(newFlipped).filter(i => newFlipped[i]).map(Number);

                if (flippedIndices.length === 2) {
                    const [first, second] = flippedIndices;
                    const card1 = games.memory[first];
                    const card2 = games.memory[second];

                    if (card1.id === card2.id) {
                        const newMatched = { ...memoryMatched, [first]: true, [second]: true };
                        setMemoryMatched(newMatched);

                        if (Object.keys(newMatched).length === 8) {
                            setUnlockedChapters([...unlockedChapters, targetChapterUnlock]);
                            setGameType('success');
                        }
                    }

                    setTimeout(() => {
                        setMemoryFlipped({});
                    }, 1000);
                }
            };

            const handleTriviaAnswer = (answer) => {
                const correct = answer === games.trivia[0].correct;
                setTriviaCorrect(correct);
                setTriviaAnswered(true);

                if (correct) {
                    setTimeout(() => {
                        setUnlockedChapters([...unlockedChapters, targetChapterUnlock]);
                        setGameType('success');
                    }, 1500);
                }
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>Who Killed Sabrina</h1>
                        <p>A Dark Mystery Unfolds</p>
                    </div>

                    <div className="cover-section">
                        <img src="https://raw.githubusercontent.com/ravennawoods26-dotcom/book-reader-app/main/IMG_20260923_005818.jpg" alt="Book Cover" className="book-cover" />
                    </div>

                    <div className="ad-space">
                        📺 Advertisement Space — Google AdMob ads here
                    </div>

                    <div className="chapters-grid">
                        {chapters.map((chapter) => (
                            <div key={chapter.id} className={`chapter-card ${!unlockedChapters.includes(chapter.id) ? 'locked' : ''}`}>
                                {!unlockedChapters.includes(chapter.id) && <span className="lock-icon">🔒</span>}
                                <div className="chapter-number">Ch. {chapter.number}</div>
                                <div className="chapter-title">{chapter.title}</div>
                                <div className="chapter-preview">{chapter.preview}</div>
                                {unlockedChapters.includes(chapter.id) ? (
                                    <button className="unlock-button" onClick={() => readChapter(chapter)}>Read Chapter</button>
                                ) : (
                                    <button className="unlock-button" onClick={() => openGameForUnlock(chapter.id)}>Unlock</button>
                                )}
                            </div>
                        ))}
                    </div>

                    {currentChapter && (
                        <div className="modal show">
                            <div className="modal-content">
                                <button className="modal-close" onClick={closeModal}>✕</button>
                                <div className="modal-title">Chapter {currentChapter.number}: {currentChapter.title}</div>
                                <div className="chapter-text">{currentChapter.content}</div>
                                <div className="ad-space">📺 Advertisement Space</div>
                            </div>
                        </div>
                    )}

                    {gameType === 'unlock' && (
                        <div className="modal show">
                            <div className="modal-content">
                                <button className="modal-close" onClick={closeModal}>✕</button>
                                <h2 style={{ color: '#d4af37', marginBottom: '20px' }}>Choose a Game to Unlock</h2>
                                <button className="btn-primary" style={{ marginRight: '10px' }} onClick={() => unlockChapterThroughGame('memory')}>
                                    🎮 Memory Match
                                </button>
                                <button className="btn-primary" onClick={() => unlockChapterThroughGame('trivia')}>
                                    🧠 Trivia Challenge
                                </button>
                            </div>
                        </div>
                    )}

                    {gameType === 'memory' && (
                        <div className="modal show">
                            <div className="modal-content">
                                <button className="modal-close" onClick={closeModal}>✕</button>
                                <div className="game-container">
                                    <div className="game-title">Memory Match Game</div>
                                    <p style={{ marginBottom: '20px', color: '#a0a0a0' }}>Match all pairs to unlock the chapter</p>
                                    <div className="memory-grid">
                                        {games.memory.map((card, index) => (
                                            <div
                                                key={index}
                                                className={`memory-card ${memoryFlipped[index] || memoryMatched[index] ? 'flipped' : ''}`}
                                                onClick={() => handleMemoryCardClick(index)}
                                            >
                                                {memoryFlipped[index] || memoryMatched[index] ? card.emoji : '?'}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {gameType === 'trivia' && (
                        <div className="modal show">
                            <div className="modal-content">
                                <button className="modal-close" onClick={closeModal}>✕</button>
                                <div className="game-container">
                                    <div className="game-title">Trivia Challenge</div>
                                    <div className="trivia-question">{games.trivia[0].question}</div>
                                    <div className="trivia-options">
                                        {games.trivia[0].options.map((option) => (
                                            <button
                                                key={option}
                                                className={`trivia-option ${triviaAnswered && option === games.trivia[0].correct ? 'correct' : triviaAnswered && option !== games.trivia[0].correct ? 'incorrect' : ''}`}
                                                onClick={() => !triviaAnswered && handleTriviaAnswer(option)}
                                                disabled={triviaAnswered}
                                            >
                                                {option}
                                            </button>
                                        ))}
                                    </div>
                                    {triviaAnswered && (
                                        <div className="success-message" style={{ color: triviaCorrect ? '#00ff00' : '#ff4444' }}>
                                            {triviaCorrect ? '✓ Correct! Chapter unlocked!' : '✗ Incorrect. Try again!'}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {gameType === 'success' && (
                        <div className="modal show">
                            <div className="modal-content">
                                <button className="modal-close" onClick={closeModal}>✕</button>
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: '3rem', marginBottom: '20px' }}>✓</div>
                                    <div className="modal-title">Chapter Unlocked!</div>
                                    <p style={{ color: '#a0a0a0', marginTop: '20px' }}>You've unlocked this chapter. Return to the main page to read it.</p>
                                    <button className="btn-primary" style={{ marginTop: '20px' }} onClick={closeModal}>Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
