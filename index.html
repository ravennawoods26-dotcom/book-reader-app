Dead on arrival. The silence in the waiting room rings in my ears, heavy and suffocating. The buzzing fluorescent lights overhead sound like a swarm of bees. I slowly pull my phone from my pocket that feels like it weighs a hundred pounds. My thumb leaves a bloody smear across the cracked glass as I unlock it.

"Stop it," Priscilla snaps, her voice trembling now, the panic finally bleeding through her clinical detachment. "I'm not doing this with you. Tell her to text me. I'm hanging up."

The line clicks dead. I lower the phone, staring blankly at the blood covering my hands, totally alone in the quiet hum of the hospital.`
